<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }

        .ui-container {
            position: fixed;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            gap: 20px;
        }

        .glass-btn {
            pointer-events: auto;
            padding: 12px 28px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .glass-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .glass-btn.active { background: rgba(255, 255, 255, 0.35); }
    </style>
</head>
<body>

    <div class="ui-container">
        <button class="glass-btn" id="btnPause">Play / Pause</button>
        <button class="glass-btn" id="btnFront">Front View</button>
        <button class="glass-btn" id="btnEarth">Earth View</button>
        <button class="glass-btn" id="btnSky">Sky View</button>
        <button class="glass-btn" id="btnAbout">About</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../build/three.module.js",
            "three/addons/": "./jsm/"
        }
    }
    </script>

    <script type="module">

    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ------------------ SCENE + RENDERER ------------------ */
    const scene = new THREE.Scene();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    /* ------------------ CAMERA + CONTROLS ------------------ */
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(0, 600, 600);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    /* ------------------ STARFIELD (far away) ------------------ */
    function createStars() {
        const starGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const positions = [];

        for (let i = 0; i < starCount; i++) {
            const r = 7000 + Math.random() * 2000; // always far away
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            positions.push(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
        }

        starGeo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));

        const starMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 2
        });

        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);
    }
    createStars();

    /* ------------------ SUN ------------------ */
    const sun = new THREE.Mesh(
        new THREE.SphereGeometry(100, 32, 32),
        new THREE.MeshStandardMaterial({ emissive: 0xffff00, emissiveIntensity: 2 })
    );
    scene.add(sun);

    /* ------------------ EARTH SYSTEM ------------------ */
    const earthOrbit = new THREE.Group();
    scene.add(earthOrbit);

    const earthTilt = new THREE.Group();
    earthTilt.rotation.z = THREE.MathUtils.degToRad(23.5);
    earthOrbit.add(earthTilt);

    const earth = new THREE.Mesh(
        new THREE.SphereGeometry(30, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0x2233ff })
    );
    earthTilt.add(earth);

    const tiltLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, -50, 0),
            new THREE.Vector3(0, 50, 0)
        ]),
        new THREE.LineBasicMaterial({ color: 0xffffff })
    );
    earthTilt.add(tiltLine);

    const ring = new THREE.Mesh(
        new THREE.RingGeometry(399, 400, 128),
        new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    scene.add(ring);

    /* ------------------ MOON SYSTEM ------------------ */
    const moonOrbitRadius = 80;
    const moonOrbit = new THREE.Group();
    earthOrbit.add(moonOrbit);

    const moon = new THREE.Mesh(
        new THREE.SphereGeometry(10, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xaaaaaa })
    );
    moonOrbit.add(moon);

    const moonRing = new THREE.Mesh(
        new THREE.RingGeometry(moonOrbitRadius - 1, moonOrbitRadius, 64),
        new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide })
    );
    moonRing.rotation.x = -Math.PI / 2;
    moonOrbit.add(moonRing);

    /* ------------------ LIGHT ------------------ */
    scene.add(new THREE.AmbientLight(0xffffff, 0.1));
    scene.add(new THREE.PointLight(0xffffff, 1000000));

    /* ------------------ STATE ------------------ */
    const state = {
        paused: false,
        angle: 0,
        speed: -0.005,
        radius: 400,
        moonAngle: 0,
        moonSpeed: -0.005 * 12
    };

    /* ------------------ CAMERA MODES ------------------ */
    let cameraMode = "free";

    function activate(btn) {
        document.querySelectorAll(".glass-btn").forEach(b => b.classList.remove("active"));
        document.getElementById(btn).classList.add("active");
    }

    function setFrontView() {
        cameraMode = "front";
        activate("btnFront");
        controls.enabled = true;
        controls.target.set(0, 0, 0);
        camera.position.set(600, 300, 600);
    }

    function setSkyView() {
        cameraMode = "sky";
        activate("btnSky");
        controls.enabled = true;
        controls.target.set(0, 0, 0);
        camera.position.set(0, 900, 0);
    }

    function setEarthView() {
        cameraMode = "earth";
        activate("btnEarth");
        controls.enabled = false;
    }

    function showAbout() {
        alert("Solar System Demo\nEarth tilt, moon orbit, and camera modes.\nCreated by Rayzhi.");
    }

    /* ------------------ BUTTON EVENTS ------------------ */
    document.getElementById("btnPause").onclick = () => {
        state.paused = !state.paused;
    };
    document.getElementById("btnFront").onclick = setFrontView;
    document.getElementById("btnEarth").onclick = setEarthView;
    document.getElementById("btnSky").onclick = setSkyView;
    document.getElementById("btnAbout").onclick = showAbout;

    /* ------------------ ANIMATION ------------------ */
    function animate() {
        requestAnimationFrame(animate);

        if (!state.paused) {
            state.angle += state.speed;
            earthOrbit.position.set(
                Math.cos(state.angle) * state.radius,
                0,
                Math.sin(state.angle) * state.radius
            );

            earth.rotation.y += 0.02;

            state.moonAngle += state.moonSpeed;
            moon.position.set(
                Math.cos(state.moonAngle) * moonOrbitRadius,
                0,
                Math.sin(state.moonAngle) * moonOrbitRadius
            );
            moonRing.position.set(0, 0, 0);
        }

        /* CAMERA MODES */
        if (cameraMode === "earth") {
            const earthPos = earthOrbit.position.clone();

            // Sunlight direction (Sun → Earth)
            const sunlightDir = earthPos.clone().sub(sun.position).normalize();

            // Perpendicular direction (rotate sunlightDir 90° around Y)
            const perpendicular = new THREE.Vector3(
                sunlightDir.z,
                0,
                -sunlightDir.x
            ).normalize();

            camera.position.copy(earthPos).add(perpendicular.multiplyScalar(150));
            camera.lookAt(earthPos);
        }

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    </script>
</body>
</html>
