<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        .ui-container {
            position: fixed;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            gap: 30px;
        }
        .glass-btn {
            pointer-events: auto;
            padding: 14px 32px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="ui-container">
        <button class="glass-btn" id="btnPause">Play / Pause</button>
        <button class="glass-btn">Earth</button>
        <button class="glass-btn">Whole system</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "../build/three.module.js",
            "three/addons/": "./jsm/"
        }
    }
    </script>

    <script type="module">

    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- SCENE + RENDERER ---
    const scene = new THREE.Scene();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- CAMERA ---
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(0, 600, 600);
    camera.lookAt(0, 0, 0);

    // --- CONTROLS ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // --- AXES (X=red, Y=green, Z=blue) ---
    const axes = new THREE.AxesHelper(500);
    scene.add(axes);

    // --- OBJECTS ---

    // Sun
    const sunGeometry = new THREE.SphereGeometry(100, 32, 32);
    const sunMaterial = new THREE.MeshStandardMaterial({
        emissive: 0xffff00,
        emissiveIntensity: 2,
        color: 0x000000
    });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    // --- EARTH SYSTEM (correct tilt structure) ---

    // 1. Earth orbits the Sun
    const earthOrbit = new THREE.Group();
    scene.add(earthOrbit);

    // 2. Earth tilt group (23.5°)
    const earthTilt = new THREE.Group();
    earthTilt.rotation.z = THREE.MathUtils.degToRad(23.5);
    earthOrbit.add(earthTilt);

    // 3. Earth mesh (rotates around its own axis)
    const earthGeometry = new THREE.SphereGeometry(30, 32, 32);
    const earthMaterial = new THREE.MeshStandardMaterial({ color: 0x2233ff });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    earth.castShadow = true;
    earth.receiveShadow = true;
    earthTilt.add(earth);

    // Earth ring
    const RING_COLOR = 0x444444;
    const ringGeo = new THREE.RingGeometry(399, 400, 128);
    const ringMat = new THREE.MeshBasicMaterial({ color: RING_COLOR, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    scene.add(ring);

    // Tilt line
    const tiltMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
    const tiltGeometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -50, 0),
        new THREE.Vector3(0,  50, 0)
    ]);
    const tiltLine = new THREE.Line(tiltGeometry, tiltMaterial);
    earthTilt.add(tiltLine);

    // --- MOON SYSTEM (correct orbit, not tilted) ---

    const moonOrbitRadius = 80;

    // Moon orbit group (follows Earth but not tilt)
    const moonOrbit = new THREE.Group();
    earthOrbit.add(moonOrbit);

    const moonGeometry = new THREE.SphereGeometry(10, 32, 32);
    const moonMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
    const moon = new THREE.Mesh(moonGeometry, moonMaterial);
    moon.castShadow = true;
    moon.receiveShadow = true;
    moonOrbit.add(moon);

    // Moon ring
    const moonRingGeo = new THREE.RingGeometry(moonOrbitRadius - 1, moonOrbitRadius, 64);
    const moonRingMat = new THREE.MeshBasicMaterial({ color: RING_COLOR, side: THREE.DoubleSide });
    const moonRing = new THREE.Mesh(moonRingGeo, moonRingMat);
    moonRing.rotation.x = -Math.PI / 2;
    moonOrbit.add(moonRing);

    // --- LIGHT ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.1));

    const sunLight = new THREE.PointLight(0xffffff, 1000000);
    sunLight.position.set(0, 0, 0);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // --- STATE ---
    const state = {
        isPaused: false,
        angle: 0,
        orbitSpeed: -0.005,
        orbitRadius: 400
    };

    const moonState = {
        angle: 0,
        speed: -0.005 * 12,
        radius: moonOrbitRadius
    };

    document.getElementById('btnPause').addEventListener('click', () => {
        state.isPaused = !state.isPaused;
    });

    // --- ANIMATION ---
    function animate() {
        requestAnimationFrame(animate);

        if (!state.isPaused) {

            // Earth orbit
            state.angle += state.orbitSpeed;
            earthOrbit.position.set(
                Math.cos(state.angle) * state.orbitRadius,
                0,
                Math.sin(state.angle) * state.orbitRadius
            );

            // Earth rotation
            earth.rotation.y += 0.02;

            // Moon orbit
            moonState.angle += moonState.speed;
            moon.position.set(
                Math.cos(moonState.angle) * moonState.radius,
                0,
                Math.sin(moonState.angle) * moonState.radius
            );

            // Moon ring stays centered on orbit
            moonRing.position.set(0, 0, 0);
        }

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    </script>
</body>
</html>
